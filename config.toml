base_url = "https://abdus.dev"
title = "abdus.dev"
description = "personal website of Abdussamet Kocak"
output_dir = "dist"

# keep links root-relative, so the site works behind a proxy like ngrok
link_strategy = "relative"

generate_sitemap = true
generate_robots_txt = false
generate_feeds = false
build_search_index = false

[markdown]
highlight_theme = "github"
external_links_target_blank = true

[link_checker]
# only fail on broken internal links; external sites come and go
external_level = "warn"

[[taxonomies]]
name = "tags"

[extra]
copyright = "abdus!"
nav = [
    { text = "abdus!", href = "/", name = "home" },
    { text = "posts", href = "/posts/" },
    { text = "projects", href = "/projects/" },
    { text = "about me", href = "/about/" },
]
