{% extends "base.html" %}

{% block title %}{{ page.title }} - {{ config.title }}{% endblock title %}

{% block head %}
    {% if page.description %}<meta name='description' content='{{ page.description }}'>{% endif %}
{% endblock head %}

{% block content %}
    <div class="single">
        <h1 class="{{ 'page-title' if page.extra.fancy_title else '' }}">{{ page.title }}</h1>
        {{ page.content | safe }}
    </div>
{% endblock content %}
