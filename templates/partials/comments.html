<aside id="comments">
    <details>
        <summary>Comments</summary>
        <p class="comments__loading">Loading...</p>
    </details>
    <style>
        .utterances {
            margin: 0;
            max-width: 100%;
        }
    </style>
</aside>
<script>
    (() => {
        const aside = document.getElementById('comments');
        const details = aside.querySelector('details');
        const loading = aside.querySelector('.comments__loading');
        let started = false;

        // utteranc.es posts a message once its iframe has rendered.
        window.addEventListener('message', (event) => {
            if (event.origin.includes('utteranc.es')) {
                loading.remove();
            }
        });

        // utterances inserts its iframe right after the script that loaded it.
        const load = () => {
            if (started) {
                return;
            }
            started = true;
            const script = document.createElement('script');
            script.src = 'https://utteranc.es/client.js';
            script.async = true;
            script.crossOrigin = 'anonymous';
            script.setAttribute('repo', 'abdusco/abdus.dev');
            script.setAttribute('issue-term', 'pathname');
            script.setAttribute('label', 'comments');
            script.setAttribute('theme', 'preferred-color-scheme');
            details.append(script);
        };

        aside.addEventListener('mouseover', load, { once: true });
        details.addEventListener('toggle', load, { once: true });
    })();
</script>
